<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>HN Driver</title>
    <style>
      body { margin:0; height:100vh; display:grid; place-items:center; background:#0b0f19; color:#e5e7eb;
             font-family: system-ui, "Segoe UI", Tahoma, sans-serif; text-align:center; }
      h1 { font-size:22px; margin:0 0 8px; color:#f5c451; }
      p { opacity:.75; margin:0 0 20px; }
      button { background:#f5c451; color:#0b0f19; border:0; padding:10px 22px; border-radius:10px;
               font-size:15px; font-weight:600; cursor:pointer; }
    </style>
  </head>
  <body>
    <div>
      <h1>تعذّر الاتصال بالخادم</h1>
      <p>تحقّق من اتصال الإنترنت ثم أعد المحاولة.</p>
      <button onclick="window.hnDesktop && window.hnDesktop.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
